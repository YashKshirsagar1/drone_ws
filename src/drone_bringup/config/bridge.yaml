# ROS 2 <-> Gazebo Transport topic bridge for the quadcopter.
# Schema: ros_gz_bridge (Jazzy). direction: BIDIRECTIONAL | GZ_TO_ROS | ROS_TO_GZ

- ros_topic_name: "/quadcopter/cmd_vel"
  gz_topic_name: "/quadcopter/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/quadcopter/enable"
  gz_topic_name: "/quadcopter/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
